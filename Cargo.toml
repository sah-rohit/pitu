[package]
name = "pitu"
version = "0.1.0"
edition = "2021"
authors = ["Pitu Developers"]
description = "A fast, scriptable CLI image workbench with smart entropy cropping, batch processing, and watermarking."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/pitu-cli/pitu"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
clap_complete = "4.5"
image = { version = "0.25", features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
imageproc = "0.25"
ab_glyph = "0.2"
rayon = "1.10"
glob = "0.3"
indicatif = "0.17"
inquire = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
console = "0.15"
env_logger = "0.11"
log = "0.4"
tempfile = "3.10"
base64 = "0.22"
crossterm = "0.25"

[[bin]]
name = "pitu"
path = "src/main.rs"
